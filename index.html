/* ---------- khung trang (#wrapper #main) – trang thật position:fixed inset:0; ở prototype nằm dưới thanh PROTOTYPE ---------- */
.insl{position:fixed;top:var(--pbar-h);left:0;right:0;bottom:0;z-index:1;background:#eee;overflow:hidden}
.insl-z{width:100%;height:100%}
.insl-main{display:flex;background-color:#f5f5f5;position:relative;height:100%}

/* ---------- nền (newUI.css antd + class.css) ---------- */
.insl{color:rgba(0,0,0,.65);font-size:14px;font-family:Roboto-Regular;font-variant:tabular-nums;line-height:1.5;font-feature-settings:"tnum";text-align:left}
:where(.insl) *,:where(.insl) ::after,:where(.insl) ::before{box-sizing:border-box}
:where(.insl) *{margin:0;padding:0;box-sizing:border-box}
:where(.insl) h1{margin-top:0;margin-bottom:.5em;color:rgba(0,0,0,.85);font-weight:500}
:where(.insl) p{margin-top:0;margin-bottom:1em;font-size:14px}
:where(.insl) ul{margin-top:0;margin-bottom:1em}
:where(.insl) ul ul{margin-bottom:0}
:where(.insl) li{list-style:none}
:where(.insl) b{font-weight:bolder}
:where(.insl) a{text-decoration:none;color:black;background-color:transparent;outline:none;cursor:pointer;transition:color .3s}
:where(.insl) a:hover{color:#40a9ff}
:where(.insl) img{vertical-align:middle;border-style:none}
:where(.insl) table{border-collapse:collapse}
/* thẻ button/input/select của trình duyệt mặc định chữ thường (UA: font -webkit-small-control) – giữ như trang thật */
:where(.insl) button,:where(.insl) input,:where(.insl) select{margin:0;color:inherit;font-size:inherit;font-family:inherit;line-height:inherit;font-weight:normal;font-style:normal;letter-spacing:normal}
:where(.insl) button,:where(.insl) input{overflow:visible}
:where(.insl) button,:where(.insl) select{text-transform:none}
:where(.insl) [type=search]{outline-offset:-2px;-webkit-appearance:none;appearance:none}
:where(.insl) ::selection{color:#fff;background:#1890ff}
:where(.insl) button{height:30px;border:none;cursor:pointer;border-radius:2px;font-size:14px;margin:0 5px;padding:0 8px;background-color:#3f4a5c;color:#fff}
:where(.insl) input,:where(.insl) select{width:100%}
:where(.insl) input[type=checkbox]{width:unset;box-sizing:border-box;padding:0}
:where(.insl) i:not([class^=ant]){padding:3px;font-size:20px !important}
:where(.insl) i:hover{cursor:pointer}
:where(.insl) .row{display:flex}
:where(.insl) .fa{display:inline-block;font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;line-height:1;font-family:FontAwesome;font-size:inherit;text-rendering:auto;-webkit-font-smoothing:antialiased}
:where(.insl) .fa-lg{font-size:1.33333em;line-height:.75em;vertical-align:-15%}
:where(.insl) .fa-share-square-o::before{content:"\f045"}
:where(.insl) .fa-info-circle::before{content:"\f05a"}
:where(.insl) .fa-tasks::before{content:"\f0ae"}
:where(.insl) .fa-caret-right::before{content:"\f0da"}
:where(.insl) .fa-sort-desc::before{content:"\f0dd"}
:where(.insl) .fa-angle-down::before{content:"\f107"}
:where(.insl) .fa-address-book::before{content:"\f2b9"}

/* ---------- menu trái (#col-left) ---------- */
.insl-left{overflow-x:hidden;width:10%;background-color:#2b364a;min-width:250px}
.insl-left::-webkit-scrollbar{width:3px}
.insl-left .insl-lhead{display:flex;height:65px;border-bottom:1px solid #515965;padding-left:10px}
.insl-left .insl-lhead h1{color:#c8c8c8;font-size:18px;line-height:65px}
.insl-left .insl-lhead i{line-height:63px;color:#27a3e0;margin-right:5px}
.insl-left .arrows{float:right;margin-right:5px;font-weight:bold;display:block;height:20px;margin-top:10px;line-height:20px;width:20px;text-align:center;border-radius:3px;font-size:13px !important}
.insl-left ul{width:100%}
.insl-left ul li{font-size:13px;line-height:40px;border-bottom:1px solid #515965;background-color:#3f4a5c}
.insl-left ul li a{color:#c8c8c8;padding-left:13%;height:100%;width:87%;display:inline-block;position:relative;cursor:pointer;box-sizing:content-box}
.insl-left ul li a i.icon-menu{position:absolute;color:#327ba5;width:13px;height:13px;text-align:center;padding:0;margin-top:13px;left:10px;font-size:13px !important}
.insl-mask{display:none}

/* ---------- cột phải (#col-right) ---------- */
.insl-right{width:90%;overflow-x:hidden;overflow-y:scroll;position:relative}
.insl-headr .info-menu{display:flex;width:auto;float:right;padding-right:10px;margin:0 10px 0 0;overflow:hidden;height:50px;line-height:50px;color:#979797}
.insl-headr .info-menu .ins-user,.insl-headr .ins-arrow{font-weight:bold;cursor:pointer}
.insl-headr .info-menu i.ins-arrow{font-size:15px !important}
.insl-right .breadcumbs{height:50px;background-color:#fff;margin-bottom:20px;box-shadow:rgba(0,0,0,.28) 0 0 4px}
.insl-right .breadcumbs p{line-height:50px;font-weight:bold;font-size:13px;padding-left:20px;color:#3f4a5c}
:where(.insl) .container{width:96.5%;margin:15px 2%;position:relative}
.insl-right > .container{border:1px solid rgba(0,0,0,.1);border-radius:.375rem;background-color:#fff;padding:3rem 1.25rem}
:where(.insl) .rn-information{background-color:#fff !important;border-top:3px solid #ff4d00 !important;margin-top:50px !important;position:relative !important;padding-left:1% !important;padding-bottom:15px !important;padding-top:10px !important;border-radius:0 !important}
:where(.insl) .title-tab{position:absolute;display:flex;top:-30px;font-size:12px;width:100%;height:27px;font-weight:bold;left:0}
:where(.insl) .title-tab h1{cursor:pointer;margin:0 13px 0 0;position:relative;background-color:#3f4a5c;color:#fff;border-radius:8px 8px 0 0;height:23px;padding:4px 15px 0 10px;font-size:14px}
:where(.insl) .title-tab h1::after{content:"\A";border-style:solid;border-width:0 10px 22px 0;border-color:transparent transparent #3f4a5c;position:absolute;right:-10px;bottom:0}
:where(.insl) .title-tab *{box-sizing:content-box}
:where(.insl) .input-wrapper{display:flex;font-size:14px}
:where(.insl) .input-wrapper label{font-weight:bold;padding-right:5px;margin:5px 0;min-width:150px}
:where(.insl) .input-wrapper p{line-height:33px}

/* ---------- tab DS (applicant.css) ---------- */
:where(.insl) .tabs-wrapper{margin:70px 2% 0;position:relative;background-color:#fff}
:where(.insl) .tabs-wrapper .container{padding:0 0 30px;margin-top:0}
:where(.insl) .tabs-wrapper .tab-list{border-bottom:3px solid #ff4d00;position:absolute;display:flex;top:-35px;font-size:12px;width:100%;font-weight:bold}
:where(.insl) .tab-list li{cursor:pointer;margin:0 13px 0 -10px;position:relative;background-color:#3f4a5c;color:#fff;border-radius:8px 8px 0 0;height:23px;padding:7px 15px 0 10px;box-sizing:content-box}
:where(.insl) .tab-list li:first-child{margin-left:0}
:where(.insl) .tab-list li::after{content:"\A";border-style:solid;border-width:0 10px 25px 0;border-color:transparent transparent #3f4a5c;position:absolute;right:-10px;bottom:0}
:where(.insl) .tab-list li:hover{background-color:#57677f;z-index:1}
:where(.insl) .tab-list li:hover::after{border-color:transparent transparent #57677f}
:where(.insl) li.tab-active{background-color:#ff4d00;color:#fff;z-index:2}
:where(.insl) li.tab-active::after{border-color:transparent transparent #ff4d00}
:where(.insl) li.tab-active:hover{background-color:#ff4d00;color:#fff;z-index:1}
:where(.insl) li.tab-active:hover::after{border-color:transparent transparent #ff4d00}

/* ---------- tìm kiếm (styles.css + class.css + select2) ---------- */
:where(.insl) .search{padding:5px 1%}
:where(.insl) .search-form{background-color:#fff;padding-bottom:15px;position:relative}
:where(.insl) .search-form{padding-top:20px;padding-bottom:0}
:where(.insl) .search-form .row{display:flex;margin-bottom:10px}
:where(.insl) .input-entry,:where(.insl) .input-entry-inline{width:98%;margin:15px 1%}
:where(.insl) .input-entry-inline{display:flex;margin:5px 1%}
:where(.insl) .search .search-form .input-entry{width:18%;margin:0 1%}
:where(.insl) .search-form button.submit{background-color:#175598;color:#fff}
:where(.insl) .send-mail-wrap{position:relative;margin-left:auto}
:where(.insl) .send-mail-wrap .btn-send-mail{background-color:#f6680f;white-space:nowrap}
:where(.insl) .ai-caret{font-size:10px}
:where(.insl) .send-mail-menu{display:none;position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:rgba(0,0,0,.15) 0 8px 24px;z-index:500;min-width:230px;overflow:hidden}
:where(.insl) .send-mail-wrap.open .send-mail-menu{display:block}
:where(.insl) .ai-mail-item{padding:10px 14px;font-size:13px;cursor:pointer;white-space:nowrap;user-select:none}
:where(.insl) .ai-mail-item:hover{background:#f7f7f7}
:where(.insl) .ai-mail-fit{color:#176b4f;border-bottom:1px solid #f0f0f0}
:where(.insl) .ai-mail-unfit{color:#c0392b}
:where(.insl) .select2-container{box-sizing:border-box;display:inline-block;margin:0;position:relative;vertical-align:middle;width:100% !important}
:where(.insl) .select2-container .select2-selection--multiple{box-sizing:border-box;cursor:pointer;display:block;min-height:32px;user-select:none}
:where(.insl) .select2-container .select2-selection--multiple .select2-selection__rendered{display:inline-block;overflow:hidden;padding-left:8px;text-overflow:ellipsis;white-space:nowrap}
:where(.insl) .select2-container .select2-search--inline{float:left}
:where(.insl) .select2-container .select2-search--inline .select2-search__field{box-sizing:border-box;border:none;font-size:100%;margin-top:5px;padding:0}
:where(.insl) .select2-container--default .select2-selection--multiple{background-color:white;border:1px solid #aaa;border-radius:4px;cursor:text}
:where(.insl) .select2-container--default .select2-selection--multiple .select2-selection__rendered{box-sizing:border-box;list-style:none;margin:0;padding:0 5px;width:100%}
:where(.insl) .select2-container--default .select2-search--inline .select2-search__field{background:transparent;border:none;outline:0;box-shadow:none;-webkit-appearance:textfield}
:where(.insl) .select2-container--default .select2-selection--multiple,:where(.insl) .select2-selection--multiple{font-size:14px}
:where(.insl) .select2-container--default .select2-selection--multiple{min-height:30px !important}
:where(.insl) .select2-container--default .select2-selection--multiple{font-size:14px;border:1px solid #9a9a9a;outline:unset}
:where(.insl) .select2-container .select2-search--inline .select2-search__field{margin-top:0}
:where(.insl) .select2-container--default .select2-selection--multiple{border-radius:2px}
:where(.insl) .select2-container .select2-selection--multiple .select2-selection__rendered input{height:20px}
:where(.insl) .select2-container--default.select2-container--focus .select2-selection--multiple{border:1px solid black;outline:0}
:where(.insl) .select2-container .select2-selection--multiple,:where(.insl) .select2-container .select2-selection--multiple .select2-selection__rendered{display:flex;align-items:center;flex-wrap:wrap}
/* select2 (JS) đặt cứng bề rộng ô gõ = bề rộng khung − 2px; prototype tính bằng CSS cho cùng kết quả */
:where(.insl) .select2-container .select2-search--inline{width:100%}
:where(.insl) .select2-container .select2-search--inline .select2-search__field{width:calc(100% + 10px)}
:where(.insl) .select2-container--default .select2-selection--multiple:focus-within{border:1px solid black}

/* ---------- vùng kết quả + bảng ---------- */
:where(.insl) .justify{justify-content:space-between}
:where(.insl) .left p{line-height:50px;font-weight:bold;color:#3f4a5c}
:where(.insl) .ajax .row.justify .left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
:where(.insl) .ajax .row.justify .left p{line-height:24px;margin:0}
:where(.insl) .ai-mail-hint{font-size:12px;font-weight:normal;line-height:18px;color:#8a8375}
:where(.insl) .ai-auto-banner{display:inline-block;font-size:12px;color:#b07a1e;background:#fbf3e3;border:1px solid #f0e3c4;border-radius:6px;padding:6px 12px;margin-bottom:10px}
:where(.insl) .table{min-height:400px;background:#fff;border-left:1px solid #ebedf0;border-right:1px solid #ebedf0;border-bottom:1px solid #ebedf0}
:where(.insl) .table table td:first-child{border-left:none}
:where(.insl) .table table td:last-child{border-right:none}
:where(.insl) .default-table{width:100%;border-collapse:collapse}
:where(.insl) .default-table thead{text-align:center;background-color:#3f4a5c;color:#fff}
:where(.insl) .default-table thead td{line-height:20px;font-weight:700;padding:10px 16px;border:1px solid #525c6c;border-spacing:0}
:where(.insl) .default-table tbody{background-color:#fff;color:#3f4a5c;font-weight:bold}
:where(.insl) .default-table tbody td{padding:7px 3px 5px 5px;line-height:25px}
:where(.insl) .default-table tbody td:nth-child(1){text-align:center}
:where(.insl) .default-table td{border:1px solid #ebedf0;border-spacing:0;font-size:13px}
:where(.insl) td img{width:120px}

/* =====================================================================
   ② Inside – trang «Sửa/Tạo tin tuyển dụng» (/RecruitmentNews/Form/{id})
   Phần HIỆN CÓ: chép đúng quy tắc CSS đang áp dụng trên inside.fptjobs.com (đọc ngày 17/11/2026):
     newUI.css (nền antd) · styles/class.css · customSelect2.css · select2 4 · styles/recruitment.css ·
     CKEditor 4.8 skin moono-lisa (editor.css) – biểu tượng thanh công cụ lấy đúng từ icons.png của trang.
   Phần MỚI: dòng tick «Bắt buộc ứng viên trả lời câu hỏi…» (cùng mẫu với dòng «Sử dụng phỏng vấn AI»)
             + khung thông tin dùng lại đúng mẫu hộp «rn-gate-box» của trang (xanh = thông tin, vàng = lưu ý).
   ===================================================================== */

/* ---------- khung trang: body nền #eee, #wrapper (trang thật cuộn cả tài liệu; prototype cuộn trong khung) ---------- */
.insf{position:fixed;top:var(--pbar-h);left:0;right:0;bottom:0;z-index:1;overflow:auto;background-color:#eee;
  color:rgba(0,0,0,.65);font-size:14px;font-family:Roboto-Regular;font-variant:tabular-nums;line-height:1.5;font-feature-settings:"tnum";text-align:left}
:where(.insf) *,:where(.insf) ::after,:where(.insf) ::before{box-sizing:border-box}
:where(.insf) *{margin:0;padding:0;box-sizing:border-box}
:where(.insf) ul{margin-top:0;margin-bottom:1em}
:where(.insf) li{list-style:none}
:where(.insf) b,:where(.insf) strong{font-weight:bolder}
:where(.insf) a{text-decoration:none;color:black;background-color:transparent;outline:none;cursor:pointer;transition:color .3s}
:where(.insf) a:hover{color:#40a9ff}
:where(.insf) img{vertical-align:middle;border-style:none}
:where(.insf) [role=button],:where(.insf) a,:where(.insf) button,:where(.insf) input,:where(.insf) label,:where(.insf) select,:where(.insf) textarea{touch-action:manipulation}
/* thẻ nhập liệu mặc định chữ thường như trình duyệt (UA) – antd chỉ kế thừa cỡ/họ chữ */
:where(.insf) button,:where(.insf) input,:where(.insf) select,:where(.insf) textarea{margin:0;color:inherit;font-size:inherit;font-family:inherit;line-height:inherit;font-weight:normal;font-style:normal;letter-spacing:normal}
:where(.insf) button,:where(.insf) input{overflow:visible}
:where(.insf) button,:where(.insf) select{text-transform:none}
:where(.insf) input[type=number],:where(.insf) input[type=text],:where(.insf) textarea{-webkit-appearance:none;appearance:none}
:where(.insf) [type=search]{outline-offset:-2px;-webkit-appearance:none;appearance:none}
:where(.insf) input[type=checkbox]{box-sizing:border-box;padding:0}
:where(.insf) ::selection{color:#fff;background:#1890ff}
:where(.insf) .clearfix::after,:where(.insf) .clearfix::before{display:table;content:""}
:where(.insf) .clearfix::after{clear:both}
:where(.insf) form input[type=checkbox]{width:14px;height:14px}

/* ---------- Modal ---------- */
const MODALS = [];
function openModal(root, html, opts = {}) {
  const ov = document.createElement('div');
  ov.className = 'ovl ' + (opts.cls || '');
  ov.innerHTML = html;
  root.appendChild(ov);
  const el = ov.firstElementChild;
  const m = { ov, el, closed: false };
  m.close = () => {
    if (m.closed) return; m.closed = true;
    ov.remove();
    const i = MODALS.indexOf(m); if (i >= 0) MODALS.splice(i, 1);
    opts.onClose && opts.onClose();
  };
  m.dismiss = () => (opts.onDismiss ? opts.onDismiss() : m.close());
  let down = false;
  ov.addEventListener('mousedown', e => { down = e.target === ov; });
  ov.addEventListener('click', e => { if (e.target === ov && down) m.dismiss(); down = false; });
  MODALS.push(m);
  setTimeout(() => { if (m.closed) return; const f = el.querySelector('[data-autofocus]') || el.querySelector('button.primary, button'); f && f.focus({ preventScroll: true }); }, 40);
  return m;
}
function confirmBox(root, { title, text, ok = 'Đồng ý', cancel = 'Hủy', danger = false }) {
  return new Promise(res => {
    const m = openModal(root, `<div class="mdl sm" role="alertdialog" aria-modal="true">
      <div class="cf-ic ${danger ? 'd' : ''}">${ic('warn', 24)}</div>
      <h3>${title}</h3><p>${text}</p>
      <div class="sm-actions"><button class="btn ghost js-no">${cancel}</button><button class="btn ${danger ? 'danger' : 'primary'} js-yes" data-autofocus>${ok}</button></div>
    </div>`, { cls: 'top', onDismiss: () => { m.close(); res(false); } });
    $('.js-no', m.el).onclick = () => { m.close(); res(false); };
    $('.js-yes', m.el).onclick = () => { m.close(); res(true); };
  });
}
function infoBox(root, { icon = 'info', title, html, buttons }) {
  const m = openModal(root, `<div class="mdl sm" role="dialog" aria-modal="true">
    <div class="inf-ic">${ic(icon, 26)}</div><h3>${title}</h3>${html}
    <div class="sm-actions">${(buttons || [{ t: 'Đóng', cls: 'primary', fn: () => m.close() }]).map((b, i) => `<button class="btn ${b.cls || 'ghost'}" data-i="${i}">${b.t}</button>`).join('')}</div>
  </div>`);
  $$('.sm-actions button', m.el).forEach(b => b.onclick = () => { const def = (buttons || [{ fn: () => m.close() }])[+b.dataset.i]; def.fn ? def.fn(m) : m.close(); });
  return m;
}
document.addEventListener('keydown', e => {

});

/* ---------- Kiểm tra tệp video (định dạng, dung lượng, thời lượng) ---------- */
function inspectVideo(f) {
  return new Promise(resolve => {
    const ext = (f.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
    if (!(VIDEO_MIME.test(f.type) || VIDEO_EXT.test(f.name))) return resolve({ error: `Định dạng “${ext || f.type || 'không rõ'}” không được hỗ trợ. Vui lòng chọn video MP4, MOV hoặc WEBM.` });
    if (f.size > LIM.videoMB * 1048576) return resolve({ error: `Video ${fmtSize(f.size)} vượt quá dung lượng tối đa ${LIM.videoMB} MB.` });
    const url = URL.createObjectURL(f);
    const v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true;
    let done = false;
    const fin = r => { if (done) return; done = true; clearTimeout(to); v.removeAttribute('src'); try { v.load(); } catch (e) {} resolve(r); };
    const check = d => {
      if (isFinite(d) && d > LIM.videoSec + 0.5) { URL.revokeObjectURL(url); fin({ error: `Video dài ${fmtDur(d)}, vượt quá thời lượng tối đa 05:00. Vui lòng cắt ngắn hoặc quay lại.` }); }
      else fin({ url, duration: d, durUnknown: !isFinite(d) });
    };
    const to = setTimeout(() => fin({ url, duration: NaN, durUnknown: true }), 8000);
    v.onloadedmetadata = () => {
      if (isFinite(v.duration) && v.duration > 0) check(v.duration);
      else { v.ontimeupdate = () => { v.ontimeupdate = null; check(v.duration); }; try { v.currentTime = 1e101; } catch (e) { check(NaN); } }
    };
    v.onerror = () => fin({ url, duration: NaN, durUnknown: true });
    v.src = url;
  });
}

  revealAnswer() {
    const el = this.el; if (!el) return;
    const area = $('#ans-area', el); if (!area) return;
    const sc = [$('.apm-right', el), $('.apm-body', el)].find(x => x && /(auto|scroll)/.test(getComputedStyle(x).overflowY) && x.scrollHeight > x.clientHeight + 2);
    if (!sc) return;
    const sTop = sc.getBoundingClientRect().top, st = sc.scrollTop;
    const pos = n => n.getBoundingClientRect().top - sTop + st;          // vị trí trong vùng cuộn
    const ansBottom = area.getBoundingClientRect().bottom - sTop + st;
    const view = sc.clientHeight - 12;
    // mốc cuộn gọn: đầu cột → câu hỏi → nhãn hình thức → vùng trả lời (không cắt ngang tiêu đề)

    let target = marks.find(p => ansBottom - p <= view);
    if (target == null) target = marks[marks.length - 1];
    if (Math.abs(target - st) > 1) sc.scrollTo({ top: target, behavior: 'smooth' });
  },
  reuseBanner(last) {

  /* ----- mobile: khối «Câu hỏi của nhà tuyển dụng» vừa khung nhìn – khung quay / ô viết co theo chiều cao màn hình ----- */
  fitAnswer() {
    const el = this.el; if (!el) return;
    const wrap = $('.rec-wrap', el), ta = $('#essay-ta', el), t = wrap || ta;
    if (!t) return;
    if (!oModalRoot().classList.contains('narrow')) { t.style.height = ''; return; }
    const body = $('.apm-body', el), card = $('.q-pnl', el);
    const cur = t.getBoundingClientRect().height, rest = card.getBoundingClientRect().height - cur;

  /* ----- quay trực tiếp ----- */
  syncRec() {
    const st = this.el && $('.rec-stage', this.el); if (!st) { this.updateReady(); return; }
    const r = this.rec;
    st.dataset.state = r.state;
    const idle = $('.rec-idle', st);
    if (r.state === 'error') idle.innerHTML = `<div class="big">${ic('alert', 26)}</div><b>Không mở được camera</b><span>${esc(r.err)}</span>`;
    else if (r.state === 'starting') idle.innerHTML = `<div class="spin"></div><b>Đang mở camera…</b><span>Vui lòng cho phép truy cập camera &amp; micro khi trình duyệt hỏi.</span>`;
    else idle.innerHTML = `<div class="big">${ic('video', 26)}</div><b>Quay video trả lời ngay trên trình duyệt</b><span>Nhấn “Bật camera” để xem trước khung hình và kiểm tra micro.</span>`;
    const live = $('.rec-live', st);
    if (r.stream && live.srcObject !== r.stream) { live.srcObject = r.stream; live.play().catch(() => {}); }
    const play = $('.rec-play', st);
    if (r.state === 'done' && this.video && play.getAttribute('src') !== this.video.url) play.src = this.video.url;
    this.renderRecCtrls();
    this.updateReady();
  },
  renderRecCtrls() {
    const c = this.el && $('.rec-ctrls', this.el); if (!c) return;
    const r = this.rec, v = this.video;
    const H = {
      idle: `<button type="button" class="btn primary js-cam">${ic('video', 16)} Bật camera</button>`,
      starting: `<button type="button" class="btn primary" disabled>Đang mở camera…</button>`,
      live: `<button type="button" class="btn rec js-start"><span class="dot"></span> Bắt đầu quay</button><button type="button" class="btn ghost js-camoff">Tắt camera</button><span class="muted sm mic-tip">${ic('mic', 13)} Nói thử – thanh xanh chuyển động là micro đã thu tiếng</span>`,
      countdown: `<button type="button" class="btn ghost js-cdcancel">Hủy đếm ngược</button><span class="muted sm">Chuẩn bị…</span>`,
      recording: `<button type="button" class="btn danger js-stop">${ic('square', 14)} Dừng quay</button><span class="muted sm">Đang quay – tự dừng ở 05:00</span>`,
      done: v ? `<span class="chip ok">${ic('check', 14, 3)} Đã quay ${fmtDur(v.duration)}<span class="d-only"> · ${fmtSize(v.size)}</span></span><button type="button" class="btn ghost js-redo">${ic('redo', 15)} Quay video khác</button><span class="muted sm d-only">Xem lại video ở trên trước khi nộp.</span>` : '',
      error: `<button type="button" class="btn primary js-cam">${ic('rotate', 15)} Thử lại</button>`,
    };
    c.innerHTML = H[r.state] || '';
    const on = (s, f) => { const b = $(s, c); if (b) b.onclick = f; };
    on('.js-cam', () => this.startCamera());
    on('.js-camoff', () => { this.stopCamera(); this.rec.state = 'idle'; this.syncRec(); });
    on('.js-start', () => { this.audioCtx(); this.startCountdown(); });
    on('.js-cdcancel', () => { clearInterval(this.rec.cd); this.rec.state = 'live'; this.syncRec(); });
    on('.js-stop', () => this.stopRecording(false));
    on('.js-redo', () => this.redo());
    this.fitAnswer();
  },
  // AudioContext dùng chung: tạo/resume NGAY trong thao tác bấm – tạo sau await (chờ quyền camera) thì Chrome/Edge (chính sách tự phát),
  // Safari, Firefox để ở trạng thái «suspended» → thanh micro đứng yên dù micro vẫn thu tiếng.
  audioCtx() {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    if (!this.ac || this.ac.state === 'closed') { try { this.ac = new AC(); } catch (e) { this.ac = null; return null; } }
    if (this.ac.state === 'suspended') this.ac.resume().catch(() => {});
    return this.ac;
  },
  async startCamera() {
    const sid = this.sid, r = this.rec;
    this.audioCtx();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') { this.recError('unsupported'); return; }
    r.state = 'starting'; this.syncRec();
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: true }); }
    catch (e) { if (sid === this.sid) this.recError(e && e.name); return; }
    if (sid !== this.sid || this.mode !== 'video' || this.vmode !== 'record') { stream.getTracks().forEach(t => t.stop()); return; }
    r.stream = stream; r.state = 'live';
    this.startMeter(stream);
    this.syncRec();
  },
  startMeter(stream) {
    try {
      const ac = this.audioCtx();
      if (!ac || !stream.getAudioTracks().length) return;
      const src = ac.createMediaStreamSource(stream), an = ac.createAnalyser(), mute = ac.createGain();
      an.fftSize = 1024; an.smoothingTimeConstant = 0.2; mute.gain.value = 0;
      src.connect(an); an.connect(mute); mute.connect(ac.destination);   // nối tới destination (âm lượng 0) để Safari xử lý nhánh phân tích
      const r = this.rec, meter = { src, an, mute }, n = an.fftSize;
      const f32 = an.getFloatTimeDomainData ? new Float32Array(n) : null, u8 = new Uint8Array(n);
      let lvl = 0, loud = performance.now(), tryAt = 0;
      r.meter = meter;
      const loop = () => {
        if (r.meter !== meter) return;
        if (ac.state === 'suspended' && performance.now() - tryAt > 1000) { tryAt = performance.now(); ac.resume().catch(() => {}); }
        let sum = 0;
        if (f32) { an.getFloatTimeDomainData(f32); for (let i = 0; i < n; i++) sum += f32[i] * f32[i]; }
        else { an.getByteTimeDomainData(u8); for (let i = 0; i < n; i++) { const x = (u8[i] - 128) / 128; sum += x * x; } }
        const rms = Math.sqrt(sum / n), db = rms > 1e-5 ? 20 * Math.log10(rms) : -100;
        const tgt = Math.max(0, Math.min(1, (db + 58) / 40));           // thang dB: -58 dB → 0 · -18 dB → đầy (giọng nói thường ~ 40–80%)
        lvl = tgt > lvl ? tgt : lvl * 0.88 + tgt * 0.12;                 // lên nhanh, xuống từ từ
        if (tgt > 0.25) loud = performance.now();
        const pill = this.el && $('.rec-mic', this.el);
        if (pill) {
          $('i', pill).style.width = Math.round(lvl * 100) + '%';
          pill.classList.toggle('on', lvl > 0.25);
          pill.classList.toggle('quiet', r.state === 'live' && performance.now() - loud > 4000);
        }
        r.raf = requestAnimationFrame(loop);
      };
      loop();
    } catch (e) { /* trình duyệt không hỗ trợ đo âm → bỏ qua thanh micro */ }
  },
  stopMeter() {
    const r = this.rec;
    cancelAnimationFrame(r.raf);
    if (r.meter) { const m = r.meter; r.meter = null; try { m.src.disconnect(); m.an.disconnect(); m.mute.disconnect(); } catch (e) {} }
  },
  recError(name) {
    const map = {
      NotAllowedError: 'Trình duyệt chưa được cấp quyền camera/micro. Hãy cho phép quyền truy cập (biểu tượng ổ khóa trên thanh địa chỉ) rồi thử lại.',
      SecurityError: 'Trình duyệt chặn truy cập camera trên trang này.',
      NotFoundError: 'Không tìm thấy camera hoặc micro trên thiết bị.',
      OverconstrainedError: 'Camera không hỗ trợ cấu hình yêu cầu.',
      NotReadableError: 'Camera đang được ứng dụng khác sử dụng. Hãy đóng ứng dụng đó rồi thử lại.',
      unsupported: 'Trình duyệt không hỗ trợ quay video trực tiếp. Hãy dùng Chrome/Safari bản mới.',
      recorder: 'Trình duyệt không khởi tạo được bộ ghi hình.',
    };
    this.stopCamera();
    this.rec.err = (map[name] || `Lỗi không xác định${name ? ' (' + name + ')' : ''}.`) + ' Bạn có thể chuyển sang tab “Tải video có sẵn” hoặc chọn “Bài luận” ở trên.';
    this.rec.state = 'error'; this.syncRec();
  },
  startCountdown() {
    const r = this.rec, sid = this.sid;
    r.state = 'countdown'; this.syncRec();
    let n = 3; const c0 = $('.rec-count', this.el); if (c0) c0.textContent = n;
    clearInterval(r.cd);
    r.cd = setInterval(() => {
      if (sid !== this.sid) { clearInterval(r.cd); return; }
      n--;
      if (n <= 0) { clearInterval(r.cd); this.beginRecording(); }
      else { const c = $('.rec-count', this.el); if (c) c.textContent = n; }
    }, 1000);
  },
  beginRecording() {
    const r = this.rec, sid = this.sid;
    if (!r.stream) { this.recError('unsupported'); return; }
    const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4'];
    const mime = (MediaRecorder.isTypeSupported ? types.find(t => MediaRecorder.isTypeSupported(t)) : '') || '';
    try { r.mr = new MediaRecorder(r.stream, mime ? { mimeType: mime, videoBitsPerSecond: 2500000 } : undefined); }
    catch (e) { this.recError('recorder'); return; }
    r.mime = r.mr.mimeType || mime || 'video/webm';
    r.chunks = [];
    r.mr.ondataavailable = e => { if (e.data && e.data.size) r.chunks.push(e.data); };
    r.mr.onstop = () => { if (sid === this.sid) this.onRecStop(); };
    r.mr.start(1000);
    r.t0 = performance.now(); r.elapsed = 0;
    r.state = 'recording'; this.syncRec();
    clearInterval(r.timer);
    r.timer = setInterval(() => this.tick(), 200);
  },
  tick() {
    const r = this.rec, el = (performance.now() - r.t0) / 1000;
    r.elapsed = el;
    const st = this.el && $('.rec-stage', this.el);
    if (st) {
      const t = $('.js-rt', st); if (t) t.textContent = fmtDur(Math.floor(el));
      const bar = $('.rec-bar i', st); if (bar) bar.style.width = Math.min(100, el / LIM.videoSec * 100) + '%';
      st.classList.toggle('warn', el >= LIM.warnSec);
      const w = $('.rec-warn', st); if (w) w.textContent = `Còn ${Math.max(0, Math.ceil(LIM.videoSec - el))} giây`;
    }
    if (el >= LIM.videoSec) this.stopRecording(true);
  },
  stopRecording(auto) {
    const r = this.rec;
    clearInterval(r.timer);
    r.elapsed = Math.min((performance.now() - r.t0) / 1000, LIM.videoSec);
    if (r.mr && r.mr.state !== 'inactive') { try { r.mr.stop(); } catch (e) {} }
    if (auto) toast('Đã đủ 05:00 – hệ thống tự dừng quay.', 'warn');
  },
  onRecStop() {
    const r = this.rec;
    const type = (r.mime || 'video/webm').split(';')[0];
    const blob = new Blob(r.chunks, { type });
    this.stopCamera();
    if (!blob.size) { this.recError('recorder'); return; }
    this.setVideo({ url: URL.createObjectURL(blob), blob, duration: r.elapsed, size: blob.size, name: 'quay-truc-tiep.' + (type.includes('mp4') ? 'mp4' : 'webm'), mime: type, method: 'record' });
    r.state = 'done';
    if (this.mode === 'video' && this.vmode === 'record') this.syncRec(); else this.updateReady();
    this.hideErr('err-q');
  },
  stopCamera() {
    const r = this.rec;
    clearInterval(r.timer); clearInterval(r.cd);
    this.stopMeter();
    if (r.mr && r.mr.state !== 'inactive') { r.mr.onstop = null; try { r.mr.stop(); } catch (e) {} }
    r.mr = null;
    if (r.stream) { r.stream.getTracks().forEach(t => t.stop()); r.stream = null; }
    const live = this.el && $('.rec-live', this.el); if (live) live.srcObject = null;
  },
  async redo() {
    const ok = await confirmBox(oModalRoot(), { title: 'Quay video khác?', text: 'Video vừa quay sẽ bị xóa để quay video mới.', ok: 'Quay video khác', cancel: 'Giữ video' });
    if (!ok) return;
    this.clearVideo();
    this.rec.state = 'idle';
    this.syncRec();
    this.startCamera();
  },
  setVideo(v) { if (this.video && !this.video.kept && this.video.url !== v.url) URL.revokeObjectURL(this.video.url); this.video = v; },
  clearVideo() { if (this.video && !this.video.kept) URL.revokeObjectURL(this.video.url); this.video = null; },

  /* ----- tải video có sẵn ----- */
  bindUpl(pane) {
    const inp = $('#vid-file', pane);
    inp.onchange = () => { const f = inp.files && inp.files[0]; inp.value = ''; if (f) this.handleFile(f); };
    const drop = $('.drop', pane);
    if (drop) {
      drop.addEventListener('click', e => { e.preventDefault(); inp.click(); });
      ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('drag'); }));
      ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('drag'); }));
      drop.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) this.handleFile(f); });
    }
    const ch = $('.js-change', pane); if (ch) ch.onclick = () => inp.click();
    const rm = $('.js-remove', pane); if (rm) rm.onclick = () => { this.clearVideo(); this.upl.error = null; this.renderVideoPane(); this.updateReady(); };
  },
  async handleFile(f) {
    const sid = this.sid;
    this.upl = { checking: true, error: null, name: f.name };
    this.renderVideoPane(); this.updateReady();
    const res = await inspectVideo(f);
    if (sid !== this.sid) { if (res.url) URL.revokeObjectURL(res.url); return; }
    this.upl = { checking: false, error: res.error || null, name: '' };
    if (!res.error) {
      this.setVideo({ url: res.url, file: f, duration: res.duration, size: f.size, name: f.name, mime: f.type || 'video/mp4', method: 'upload', durUnknown: !!res.durUnknown });
      if (this.rec.state === 'done') this.rec.state = 'idle';
      this.hideErr('err-q');
    }
    if (this.mode === 'video' && this.vmode === 'upload') this.renderVideoPane();
    this.updateReady();
  },

  /* ----- bài luận (tự lưu nháp – BR-19) ----- */
  essayHTML() {
    return `<div class="essay" id="essay">
      ${this.restored ? `<div class="restored" ${mk('de')}>${ic('rotate', 14)}<span>Đã khôi phục bản nháp lưu lúc ${fmtTime(this.restored)}.</span>${pin('BR-19')}</div>` : ''}
      <textarea id="essay-ta" aria-label="Bài luận trả lời" placeholder="Viết bài luận của bạn tại đây (tối đa 500 từ)…&#10;Gợi ý: Bối cảnh → Khó khăn → Cách bạn giải quyết → Kết quả &amp; bài học.">${esc(this.essay)}</textarea>
      <div class="wc-row"><span class="wc" id="wc"><b>0</b> / ${LIM.essayWords} từ</span><div class="wbar"><i></i></div>${pin('BR-06')}<span class="draft-note"></span></div>
      <div class="f-err" id="err-essay" role="alert" hidden></div>
    </div>`;
  },
  bindEssay() {
    const ta = $('#essay-ta', this.el);
    ta.addEventListener('input', () => { this.essay = ta.value; this.updateWC(); this.saveDraft(); });
    this.updateWC();
    if (S.drafts[this.job.id]) this.paintDraftNote();
    setTimeout(() => { if (document.body.contains(ta)) { ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length); } }, 30);
  },
  updateWC() {
    const box = this.el && $('#essay', this.el); if (!box) return;
    const n = countWords(this.essay), max = LIM.essayWords;
    $('#wc b', box).textContent = n;
    $('.wbar i', box).style.width = Math.min(100, n / max * 100) + '%';
    box.classList.toggle('over', n > max);
    box.classList.toggle('near', n >= max * 0.9 && n <= max);
    const er = $('#err-essay', box);
    if (n > max) { er.hidden = false; er.innerHTML = ic('alert', 14) + `<span>Bài luận đang có ${n} từ, vượt quá ${max} từ. Vui lòng rút gọn ${n - max} từ.</span>`; }
    else er.hidden = true;
    if (n > 0) this.hideErr('err-q');
    this.updateReady();
  },
  saveDraft(now) {
    clearTimeout(this.dt);
    const job = this.job; if (!job) return;
    const run = () => {
      if (this.essay.trim()) S.drafts[job.id] = { text: this.essay, at: new Date() }; else delete S.drafts[job.id];
      this.paintDraftNote();
    };
    if (now) run(); else this.dt = setTimeout(run, 400);
  },
  paintDraftNote() {
    const n = this.el && $('.draft-note', this.el); if (!n || !this.job) return;
    const d = S.drafts[this.job.id];
    n.innerHTML = d ? `${ic('check', 12, 3)} Đã lưu nháp ${fmtTime(d.at)}` : '';
  },

  /* ----- dùng lại câu trả lời (BR-11) ----- */
  useReuse() {
    const last = S.lastAnswer; if (!last) return;
    this.stopCamera(); this.clearVideo(); this.essay = '';
    this.reuse = last; this.mode = last.type;
    this.hideErr('err-q');
    this.renderAnswer();
  },
  reuseView() {
    const a = this.reuse;
    const what = a.type === 'video' ? 'video ' + fmtDur(a.duration) : 'bài luận ' + countWords(a.text) + ' từ';
    const body = a.type === 'video' ? `<div class="vprev"><video controls playsinline preload="metadata" src="${a.url}"></video></div>` : `<div class="reuse-essay">${esc(a.text)}</div>`;
    return `<div class="reuse-view"><div class="rv-h">${ic('checkCircle', 16)} Dùng lại ${what} đã nộp cho “${esc(a.jobTitle)}”<button type="button" class="lnk js-newans">${ic('pen', 14)} Trả lời mới</button></div>${body}</div>`;
  },

  /* ----- thanh trạng thái cạnh nút Nộp ----- */
  updateReady() {
    const r = this.el && $('#ready', this.el); if (!r) return;
    let cls = 'none', icn = 'alert', txt = 'Chưa có câu trả lời';
    if (this.reuse) { cls = 'ok'; icn = 'checkCircle'; txt = `Dùng lại ${this.reuse.type === 'video' ? 'video ' + fmtDur(this.reuse.duration) : 'bài luận ' + countWords(this.reuse.text) + ' từ'} – sẵn sàng nộp`; }
    else if (this.mode === 'video') {
      const st = this.rec.state;
      if (st === 'countdown' || st === 'recording') { cls = 'rec'; icn = 'video'; txt = 'Đang quay video…'; }
      else if (this.upl.checking) { icn = 'clock'; txt = 'Đang kiểm tra video…'; }
      else if (this.video) { cls = 'ok'; icn = 'checkCircle'; txt = `Video ${this.video.durUnknown ? '' : fmtDur(this.video.duration) + ' '}– sẵn sàng nộp`; }
      else txt = 'Chưa có video – hãy quay hoặc tải lên';
    } else if (this.mode === 'essay') {
      const n = countWords(this.essay);
      if (n > LIM.essayWords) { cls = 'bad'; txt = `Bài luận ${n}/${LIM.essayWords} từ – cần rút gọn`; }
      else if (n > 0) { cls = 'ok'; icn = 'checkCircle'; txt = `Bài luận ${n}/${LIM.essayWords} từ – sẵn sàng nộp`; }
      else txt = 'Chưa có bài luận';
    }
    r.className = 'ready ' + cls;
    r.innerHTML = ic(icn, 16) + `<span>${txt}</span>`;
  },

  /* ----- nộp ----- */
  validate() {
    if (this.reuse) return { ans: Object.assign({}, this.reuse) };
    if (!this.mode) return { err: 'Vui lòng chọn hình thức trả lời: Video hoặc Bài luận.' };
    if (this.mode === 'video') {
      if (['countdown', 'recording'].includes(this.rec.state)) return { err: 'Bạn đang quay video. Vui lòng dừng quay trước khi nộp.' };
      if (this.upl.checking) return { err: 'Đang kiểm tra video, vui lòng chờ trong giây lát.' };
      if (!this.video) return { err: 'Vui lòng quay hoặc tải lên video trả lời (tối đa 05:00).' };
      const v = this.video;
      return { ans: { type: 'video', method: v.method, url: v.url, duration: v.duration, durUnknown: !!v.durUnknown, size: v.size, fileName: v.name, mime: v.mime } };
    }
    const n = countWords(this.essay);
    if (!n) return { err: 'Vui lòng nhập bài luận trả lời câu hỏi.' };
    if (n > LIM.essayWords) return { err: `Bài luận vượt quá ${LIM.essayWords} từ (hiện tại ${n} từ). Vui lòng rút gọn.` };
    return { ans: { type: 'essay', text: this.essay.trim() } };
  },
  async submit() {
    if (this.submitting) return;
    const el = this.el;
    const { ans, err } = this.validate();
    if (err) {
      this.showErr('err-q', err);
      $('#err-q', el).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      const b = $('.js-submit', el); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      return;
    }
    this.hideErr('err-q');
    this.pending = ans;
    this.lock(true);
    await this.runUpload();
  },
  async runUpload() {
    const el = this.el, ans = this.pending; if (!el || !ans) return;
    const isUpload = ans.type === 'video' && !this.reuse;
    $('.js-uptxt', el).textContent = isUpload ? `Đang tải video lên (${fmtSize(ans.size)})…` : 'Đang nộp hồ sơ…';
    const total = isUpload ? Math.min(3200, 1100 + ans.size / 1048576 * 18) : 700;
    const r = await this.progress(total);
    if (!this.el || r === 'abort') return;
    this.finish(ans);
  },
  progress(ms) {
    return new Promise(res => {
      const t0 = performance.now(), sid = this.sid;
      const step = () => {
        if (sid !== this.sid || !this.el) return res('abort');
        const p = Math.min(1, (performance.now() - t0) / ms);
        const pct = Math.round(100 * (1 - Math.pow(1 - p, 2)));
        const bar = $('.upbar-track i', this.el), t = $('.js-uppct', this.el);
        if (bar) bar.style.width = pct + '%'; if (t) t.textContent = pct + '%';
        if (p < 1) requestAnimationFrame(step); else setTimeout(() => res('ok'), 180);
      };
      requestAnimationFrame(step);
    });
  },
  finish(ans) {
    const job = this.job;
    const app = newApp(job, { answer: Object.assign({}, ans, { reused: !!this.reuse }) });
    S.apps.unshift(app);
    if (!this.reuse) S.lastAnswer = Object.assign({}, ans, { jobId: job.id, jobTitle: job.title, at: app.at });
    delete S.drafts[job.id];
    if (this.video) this.video.kept = true;
    this.destroy();
    showSuccess(job, app);
  },
  lock(on) {
    const el = this.el; if (!el) return;
    this.submitting = on;
    $$('button, input, textarea', el).forEach(x => { if (x.closest('.vprev') || x.closest('.upbar') || x.classList.contains('pin')) return; x.disabled = on; });
    $('.apm-row', el).hidden = on;
    $('.upbar', el).hidden = !on;
    if (!on) this.renderAnswer();
  },
  showErr(id, msg) { const e = this.el && $('#' + id, this.el); if (e) { e.hidden = false; e.innerHTML = ic('alert', 14) + `<span>${esc(msg)}</span>`; this.fitAnswer(); } },
  hideErr(id) { const e = this.el && $('#' + id, this.el); if (e && !e.hidden) { e.hidden = true; this.fitAnswer(); } },

  async tryClose() {
    if (this.submitting || !this.el) return;
    if (this.mode === 'essay' && !this.reuse) this.saveDraft(true);
    const hasVideo = !this.reuse && (this.video || ['countdown', 'recording'].includes(this.rec.state));
    if (hasVideo) {
      const ok = await confirmBox(oModalRoot(), { title: 'Hủy nộp hồ sơ?', text: 'Video chưa nộp sẽ không được lưu.', ok: 'Hủy nộp', cancel: 'Tiếp tục trả lời', danger: true });
      if (!ok) return;
    }
    const drafted = this.mode === 'essay' && !this.reuse && this.job && S.drafts[this.job.id];
    this.destroy();
    if (drafted) toast('Đã lưu nháp bài luận – mở lại để viết tiếp.', 'ok');
  },
  destroy() {
    this.sid++;
    clearTimeout(this.dt);
    this.stopCamera();
    if (this.ac) { const ac = this.ac; this.ac = null; try { ac.close(); } catch (e) {} }
    if (this.video && !this.video.kept) URL.revokeObjectURL(this.video.url);
    this.video = null;
    if (this.m && !this.m.closed) this.m.close();
    this.m = null; this.el = null; this.submitting = false;
  },
};

function selectCfgJob(id) { const j = getJob(id); S.cfg = { jobId: id, ai: j.ai, reqQ: j.reqQ }; }
function cfgDirty() { const j = getJob(S.cfg.jobId); return j.ai !== S.cfg.ai || j.reqQ !== S.cfg.reqQ; }
// Bật/tắt yêu cầu cho 1 tin – áp dụng BR-13
function setReq(job, on) {
  if (on && !job.reqQ) { job.reqQ = true; job.reqSince = new Date(); appsOf(job.id).forEach(a => { if (a.answer.type === 'notreq') a.answer = { type: 'before' }; }); }
  if (!on && job.reqQ) { job.reqQ = false; job.reqSince = null; appsOf(job.id).forEach(a => { if (a.answer.type === 'before') a.answer = { type: 'notreq' }; }); }
}

function bindConfig() {
  const root = $('#scr-config');
  const lastT = () => S.cfg.ai ? 5 : 4;
  const upd = () => { $('.js-back', root).style.display = S.cfgTab > 1 ? '' : 'none'; $('.js-next', root).style.display = S.cfgTab < lastT() ? '' : 'none'; };
  const show = t => {
    S.cfgTab = t;
    $$('.tab-list li', root).forEach(li => li.classList.toggle('tab-active', +li.dataset.t === t));
    $$('.tab-content > .tab', root).forEach(p => p.classList.toggle('active', +p.dataset.t === t));
    upd();
  };
  $$('.tab-list li', root).forEach(li => $('a', li).onclick = e => { e.preventDefault(); show(+li.dataset.t); });
  $('.js-back', root).onclick = () => show(Math.max(1, S.cfgTab - 1));
  $('.js-next', root).onclick = () => show(Math.min(lastT(), S.cfgTab + 1));
  upd();
  $('#cfg-ai', root).onchange = e => { S.cfg.ai = e.target.checked; renderConfig('cfg-ai'); };
  $('#cfg-req', root).onchange = e => { S.cfg.reqQ = e.target.checked; renderConfig('cfg-req'); };
  $('.js-save', root).onclick = () => saveCfg();
  $('.js-huy', root).onclick = async () => {
    if (!cfgDirty()) { toast('Prototype: «Hủy» đóng form và quay về danh sách tin (không có thay đổi).'); return; }
    const ok = await confirmBox($('#g-modal-root'), { title: 'Bỏ thay đổi chưa lưu?', text: 'Các thay đổi trên form sẽ không được lưu.', ok: 'Bỏ thay đổi', cancel: 'Ở lại', danger: true });
    if (ok) { selectCfgJob(S.cfg.jobId); renderConfig(); toast('Đã bỏ thay đổi chưa lưu.'); }
  };
  $$('.js-upload', root).forEach(b => b.onclick = () => toast('Prototype: «Tải ảnh» là chức năng hiện có.'));
}
function saveCfg(silent) {
  const job = getJob(S.cfg.jobId);
  const on = S.cfg.reqQ && !job.reqQ, off = !S.cfg.reqQ && job.reqQ;
  job.ai = S.cfg.ai;
  setReq(job, S.cfg.reqQ);
  if (!silent) toast(on ? `Đã lưu tin. Yêu cầu trả lời câu hỏi áp dụng cho hồ sơ nộp từ ${fmtDT(job.reqSince)}.` : off ? 'Đã lưu tin. Tin không còn yêu cầu trả lời câu hỏi; câu trả lời cũ vẫn được giữ.' : 'Đã lưu tin.', 'ok');

}

/* lọc tại chỗ (không dựng lại trang) – giữ nguyên ô tìm kiếm khi gõ tiếng Việt */
function insApplyFilter() {
  const root = $('#scr-apps'), d = insListData();
  $('.default-table tbody', root).innerHTML = insTbody(d);
  $('.js-total', root).textContent = d.list.length;
  bindInsRows(root);
}

function bindInsRows(root) {
  $$('tbody tr[data-id]', root).forEach(tr => {
    const id = tr.dataset.id;
    $('.js-open', tr).onclick = e => { e.preventDefault(); openDrawer(id); };
    $$('[data-jump]', tr).forEach(b => {
      const go = () => openDrawer(id, { jump: b.dataset.jump });
      b.onclick = go;
      b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    });
    $('.js-drop', tr).onclick = e => {
      e.stopPropagation();
      const dd = e.currentTarget.closest('.dropdown-button'), was = dd.classList.contains('open');
      $$('.dropdown-button.open', root).forEach(x => x.classList.remove('open'));
      dd.classList.toggle('open', !was);
    };
    $$('.js-approve', tr).forEach(b => b.onclick = () => { $$('.dropdown-button.open', root).forEach(x => x.classList.remove('open')); toast(`Prototype: «${b.textContent}» là thao tác phê duyệt hiện có – không đổi trong phạm vi này.`); });
    $('.js-share', tr).onclick = e => { e.preventDefault(); toast('Prototype: «Chia sẻ» hồ sơ là chức năng hiện có.'); };
  });
}

function bindInsList(root) {
  const main = $('.insl-main', root);
  const qi = $('#ap-q', root);
  qi.oninput = () => { S.fText = qi.value; insApplyFilter(); };
  qi.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); S.fText = qi.value; insApplyFilter(); } };
  const fa = $('#ap-ans', root); if (fa) fa.onchange = () => { S.fAns = fa.value; insApplyFilter(); };
  $('.js-search', root).onclick = () => { S.fText = qi.value; insApplyFilter(); };
  $('.js-excel', root).onclick = () => toast('Prototype: «Xuất excel» là chức năng hiện có.');
  const mw = $('.send-mail-wrap', root);
  if (mw) {
    $('.js-mail', mw).onclick = e => { e.stopPropagation(); mw.classList.toggle('open'); };
    $$('.js-mail-it', mw).forEach(it => it.onclick = () => { mw.classList.remove('open'); toast('Prototype: «Gửi mail» kết quả PV AI là chức năng hiện có – chưa chọn ứng viên nào.'); });
  }
  const ca = $('.js-checkall', root);
  if (ca) ca.onchange = () => { ca.checked = false; toast('Chưa có ứng viên nào có kết quả AI để chọn gửi mail.'); };
  $$('.js-nav', root).forEach(a => a.onclick = e => { e.preventDefault(); toast('Ngoài phạm vi prototype.'); });
  $$('.js-tab', root).forEach(t => t.onclick = () => toast(`Prototype: chỉ dựng tab «DS nộp đơn» (tab «${t.textContent}» giữ nguyên như hiện tại).`));
  $('.js-mask', root).onclick = () => main.classList.toggle('menu-open');
  $('.insl-left', root).onmouseleave = () => main.classList.remove('menu-open');
  root.onclick = e => {
    if (!e.target.closest('.dropdown-button')) $$('.dropdown-button.open', root).forEach(x => x.classList.remove('open'));
    if (mw && !e.target.closest('.send-mail-wrap')) mw.classList.remove('open');
  };
  bindInsRows(root);
}

      <div class="itv-q-main essay"><div class="itv-q-essay js-essay"><div class="itv-ai-subhead">📄 Bài luận của ứng viên</div>${x.text.split(/\n+/).filter(s => s.trim()).map(p => `<p>${esc(p)}</p>`).join('')}</div></div>
      <div class="itv-ai-transcript-col itv-q-side">
        <div class="itv-ai-subhead">Thông tin câu trả lời</div>
        <dl class="itv-q-kv">
          <dt>Hình thức</dt><dd>Bài luận</dd>
          <dt>Số từ</dt><dd>${w} <span class="itv-ai-muted">/ tối đa ${LIM.essayWords}</span></dd>
          <dt>Thời gian đọc</dt><dd>khoảng ${Math.max(1, Math.round(w / 200))} phút</dd>
          <dt>Thời điểm nộp</dt><dd>${fmtDT(a.at)}</dd>
          ${x.reused ? '<dt>Ghi chú</dt><dd>Dùng lại câu trả lời từ hồ sơ trước</dd>' : ''}
        </dl>
        <div class="itv-q-actions"><button type="button" class="itv-ai-btn-back js-copy">${ic('copy', 14)} Sao chép bài luận</button></div>
      </div>
    </div>`;
  }
  return `<div class="itv-q-root" id="itv-q-root" ${mk('chat')}><div class="itv-ai-section">
    <div class="itv-ai-section-title">Câu hỏi ứng tuyển</div>${pin('BR-07')}
    <div class="itv-ai-meta">${meta}</div>
    <div class="itv-ai-card">${head}${body}</div>
  </div></div>`;
}

/* Khối «Đánh giá» của PV Chang AI – HIỆN CÓ, chép đúng trạng thái trang thật (không đổi) */
function insAiSection(a) {
  const card = (no, title, empty, note) => `<div class="itv-ai-card"><div class="itv-ai-sechead"><span class="itv-ai-secno">${no}</span><span class="itv-ai-sectitle">${title}</span>${note ? `<span class="itv-ai-secnote">${note}</span>` : ''}</div><div class="itv-ai-card"><div class="itv-ai-empty-inline">${empty}</div></div></div>`;
  return `<div class="ins-ai-root"><div class="itv-ai-section">
    <div class="itv-ai-section-title">Đánh giá</div>
    <div class="itv-ai-meta"><span>📅 Phỏng vấn AI ngày <b>${fmtDate(a.at)}</b></span><span class="itv-ai-meta-note">Mỗi ứng viên chỉ phỏng vấn AI <b>1 lần</b>.</span></div>
    <div class="itv-ai-card"><div class="itv-ai-sechead"><span class="itv-ai-secno">1</span><span class="itv-ai-sectitle">KẾT LUẬN TỔNG QUAN</span></div>
      <div class="itv-ai-concl"><div class="itv-ai-scorecard"><div class="itv-ai-score-label">ĐIỂM TỔNG</div><div class="itv-ai-score-value">—<span class="itv-ai-score-denom"></span></div><div class="itv-ai-score-sub"></div><div class="itv-ai-reco"><div class="itv-ai-reco-label">ĐỀ XUẤT CỦA AI</div><div class="itv-ai-reco-value itv-ai-reco-none">AI chưa đưa ra đề xuất</div></div></div>
      <div class="itv-ai-assess"><div class="itv-ai-assess-title">ĐÁNH GIÁ ĐỘ PHÙ HỢP</div><div class="itv-ai-empty-inline">Chưa có phần đánh giá độ phù hợp cho ứng viên này.</div></div></div></div>
    ${card(2, 'BẢNG ĐIỂM NĂNG LỰC THEO TIÊU CHÍ', 'Chưa có bảng điểm theo tiêu chí cho buổi phỏng vấn này.')}
    ${card(3, 'PHÂN TÍCH CHI TIẾT TỪNG CÂU HỎI', 'Chưa có câu trả lời nào được ghi nhận cho buổi phỏng vấn này.', '— bấm vào từng câu hỏi để xem video &amp; transcript tương ứng')}
    ${card(4, 'ĐIỀU KIỆN LÀM VIỆC VÀ ĐỐI CHIẾU CV', 'Chưa có điều kiện làm việc và đối chiếu CV cho ứng viên này.')}
    <div class="itv-ai-disclaimer">Lưu ý: Kết quả AI chỉ mang tính chất đề xuất hỗ trợ tuyển dụng. Quyết định cuối cùng thuộc về Cán bộ tuyển dụng hoặc Quản lý tuyển dụng.</div>
  </div></div>`;
}

function insPage(a, job) {
  const p = INS_PROFILE[a.id] || Object.assign({}, INS_DEFAULT, { wish: job.short });
  return `<div class="ins-page"><div class="ins-wrapper"><div class="ins-form">
    <div class="rn-information">
      <div class="title-tab"><h1>Thông tin cá nhân</h1></div>
      <div class="content-tab row">
        <div class="cols3"><div class="thumbnail ins-photo"><img alt="${esc(a.name)}" src="${INS_PHOTO}"></div></div>
        <div class="cols3">${insF('Họ tên', esc(a.name))}${insF('Số điện thoại', esc(a.phone))}${insF('Email', esc(a.email))}${insF('Ngày sinh', p.dob)}${insF('Giới tính', p.sex)}</div>
        <div class="cols3">${insF('Chiều cao / Cân nặng', p.hw)}${insF('Số CMTND/thẻ căn cước', '')}${insF('Tình trạng hôn nhân', p.mar)}${insF('Quê quán', p.home)}${insF('Nơi ở hiện tại', p.addr)}</div>
      </div>
    </div>
    <div class="row">
      <div class="rn-information cols3">
        <div class="title-tab"><h1>Quá trình học tập</h1></div>
        <div class="content-tab">${insF('Hệ:', p.edu)}${insF('Trường:', p.school)}${insF('Chuyên ngành:', p.major)}
          <div class="input-entry-inline"><label>Kinh nghiệm làm việc</label><div class="input-content"><textarea readonly style="width:100%;resize:none;border-radius:3px;height:80px;border:none">${esc(p.exp)}</textarea></div></div>
          <div class="input-entry-inline"><label>Hồ sơ của bạn:</label><div class="input-content"><a href="#" class="c-blue js-cv" style="color:blue">Tải xuống</a></div></div>
        </div>
      </div>
      <div class="rn-information cols7">
        <div class="title-tab"><h1>Vị trí ứng tuyển</h1></div>
        <div class="content-tab row">
          <div class="cols5">${insF('Vị trí ứng tuyển:', esc(job.title))}${insF('Ngày ứng tuyển', insDMY(a.at))}${insF('Nơi làm việc mong muốn', esc(p.wish || job.short))}</div>
          <div class="cols5">${insF('Trạng thái', esc(INS_STATUS[a.status] || a.status))}${insF('Điểm thi', '0.0 / 0.0')}${insSumRow(a)}</div>
        </div>
      </div>
    </div>
    ${insQSection(a, job)}
    ${a.source === 'ai' ? insAiSection(a) : ''}
  </div></div></div>`;
}

let DRW = null;
function openDrawer(id, opt) {
  closeDrawer(false);
  const a = S.apps.find(x => x.id === id); if (!a) return;
  const job = getJob(a.jobId);
  const ov = document.createElement('div');
  ov.className = 'ins-ovl';
  ov.innerHTML = `<div class="ins-win" role="dialog" aria-modal="true" aria-label="Thông tin ứng viên ${esc(a.name)}">
    <div class="ins-bar"><span class="ins-fav">F</span><span class="ins-url">inside.fptjobs.com<i>/ApplicantApply/getApplicantInformation/${insId(a)}</i></span><span class="ins-tag">CỬA SỔ INSIDE · MÔ PHỎNG</span><button type="button" class="ins-x js-x" aria-label="Đóng cửa sổ">${ic('x', 18)}</button></div>
    <div class="ins-scroll">${insPage(a, job)}</div>
  </div>`;
  $('#g-modal-root').appendChild(ov);
  DRW = { ov, a };
  ov.addEventListener('click', e => { if (e.target === ov) closeDrawer(true); });
  $('.js-x', ov).onclick = () => closeDrawer(true);
  bindInsPage(ov, a);
  if (opt && opt.jump) { // bấm huy hiệu ở danh sách → mở thẳng tới khối câu trả lời / khối «Đánh giá»
    const el = $(opt.jump === 'ai' ? '.ins-ai-root' : '#itv-q-root', ov), sc = $('.ins-scroll', ov);
    if (el) sc.scrollTop = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 12;
  }
  setTimeout(() => { const x = $('.js-x', ov); x && x.focus({ preventScroll: true }); }, 30);
}
function closeDrawer(refresh) {
  if (!DRW) return;
  DRW.stop && DRW.stop();
  $$('video', DRW.ov).forEach(v => { try { v.pause(); } catch (e) {} });
  DRW.ov.remove(); DRW = null;
  if (refresh && S.screen === 'apps') renderApps(); // giữ vị trí cuộn của danh sách
}
function bindInsPage(ov, a) {
  const x = a.answer, scroller = $('.ins-scroll', ov);
  let rate = 1;
  const go = el => { if (!el) return; scroller.scrollTo({ top: el.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop - 12, behavior: 'smooth' }); };
  $$('.js-jump', ov).forEach(l => l.onclick = e => { e.preventDefault(); go($('#itv-q-root', ov)); });
  const cv = $('.js-cv', ov); if (cv) cv.onclick = e => { e.preventDefault(); toast('Prototype: tải CV (chức năng hiện có).'); };
  /* video: khung phát giống khối «Đánh giá» – bấm ▶ mới lấy link phát */
  const box = $('.js-vbox', ov);
  let fake = null;
  const setRate = r => { rate = r; const v = $('video.itv-ai-video', ov); if (v) v.playbackRate = r; if (fake) fake.rate(r); };
  const startFake = () => {
    let t = 0, timer = null;
    const dur = Math.round(x.duration);
    box.innerHTML = `<div class="itv-q-fake js-fake"><span class="cap">Video mẫu (prototype) – không có nội dung thật</span><div class="av">${initials(a.name)}</div><div class="ctl"><button type="button" class="js-fpp" aria-label="Phát/Tạm dừng">${ic('pause', 12)}</button><span class="js-ft">00:00</span><div class="prog"><i></i></div><span>${fmtDur(dur)}</span></div></div>`;
    const el = $('.js-fake', box), btn = $('.js-fpp', box);
    const paint = () => { $('.js-ft', el).textContent = fmtDur(t); $('.prog i', el).style.width = Math.min(100, t / dur * 100) + '%'; };
    const stop = () => { clearInterval(timer); timer = null; el.classList.remove('playing'); btn.innerHTML = ic('play', 12); };
    const play = () => { clearInterval(timer); if (t >= dur) t = 0; el.classList.add('playing'); btn.innerHTML = ic('pause', 12); timer = setInterval(() => { t = Math.min(dur, t + 1); paint(); if (t >= dur) stop(); }, 1000 / rate); };
    el.onclick = () => timer ? stop() : play();
    fake = { rate: () => { if (timer) play(); }, stop };
    DRW.stop = stop;
    play();
  };
  const startVideo = () => {
    const fr = $('.js-vplay', box); if (!fr) return;
    fr.classList.add('itv-ai-videoframe-off');
    fr.innerHTML = '<div class="itv-ai-videomsg">Đang lấy link phát…</div>';
    setTimeout(() => {
      if (!DRW || DRW.a !== a) return;
      if (x.sample || !x.url) { startFake(); return; }
      box.innerHTML = `<video class="itv-ai-video" src="${x.url}" controls autoplay playsinline></video>`;
      const v = $('video', box); v.playbackRate = rate;
      v.onerror = () => { const er = $('.js-verr', ov); er.hidden = false; er.textContent = 'Không lấy được link phát video.'; };
    }, 500);
  };
  if (box) {
    const fr = $('.js-vplay', box);
    fr.onclick = startVideo;
    fr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startVideo(); } };
  }
  $$('.itv-q-rate', ov).forEach(b => b.onclick = () => { $$('.itv-q-rate', ov).forEach(o => o.classList.toggle('on', o === b)); setRate(+b.dataset.rate); });
  const dl = $('.js-dlv', ov); if (dl) dl.onclick = () => toast('Prototype: video mẫu không có tệp thật để tải.');
  const cp = $('.js-copy', ov);
  if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(x.text); toast('Đã sao chép bài luận.', 'ok'); } catch (e) { toast('Trình duyệt không cho phép sao chép tự động.', 'warn'); } };
}

/* =========================================================
   Điều hướng prototype
   ========================================================= */
const TABS = [['outside', 'UV', '① Trang tin &amp; Nộp hồ sơ'], ['config', 'HR', '② Cấu hình tin'], ['apps', 'HR', '③ Hồ sơ ứng tuyển']];
function renderPbar() {
  $('#pbar').innerHTML = `<span class="pbar-tag">PROTOTYPE</span>
    <div class="pbar-title"><b>Câu hỏi bắt buộc khi ứng tuyển</b><small>FPTJobs · v2.13 · 19/11/2026 · dữ liệu mẫu</small></div>
    <nav class="pbar-tabs" role="tablist" aria-label="Màn hình prototype">${TABS.map(([k, side, t]) => `<button type="button" role="tab" class="pbar-tab ${S.screen === k ? 'active' : ''}" data-s="${k}" aria-selected="${S.screen === k}"><span class="side">${side}</span>${t}</button>`).join('')}</nav>
    <div class="pbar-tools">
      <button type="button" class="pbar-btn js-reset" title="Reset dữ liệu demo">${ic('rotate', 14)}<span>Reset</span></button>
    </div>`;
  $$('.pbar-tab').forEach(b => b.onclick = () => setScreen(b.dataset.s));
  $('.js-reset').onclick = async () => {
    const ok = await confirmBox($('#g-modal-root'), { title: 'Reset dữ liệu demo?', text: 'Xóa hồ sơ vừa nộp, bản nháp và cấu hình đã đổi, quay về dữ liệu mẫu ban đầu.', ok: 'Reset', cancel: 'Hủy', danger: true });
    if (ok) resetAll();
  };
}
function render() {
  if (S.screen === 'outside') renderOutside();
  else if (S.screen === 'config') renderConfig();
  else renderApps();
}
function setScreen(s) {
  ApplyCtl.destroy();
  MODALS.slice().forEach(m => m.close());
  closeDrawer(false); hidePin();
  if (s === 'config' && S.screen !== 'config' && !cfgDirty()) selectCfgJob(S.screen === 'outside' ? S.curJob : S.screen === 'apps' ? S.appsJob : S.cfg.jobId);
  if (s !== 'config') S.bulk = { on: false, sel: [] };
  S.screen = s;
  $$('.screen').forEach(x => { x.hidden = x.id !== 'scr-' + s; });
  renderPbar();
  render();
  window.scrollTo(0, 0);
}
function resetAll() {
  ApplyCtl.destroy(); closeDrawer(false);
  S.apps.forEach(a => { if (a.session && a.answer && a.answer.url && !a.answer.reused) URL.revokeObjectURL(a.answer.url); });
  const keep = { screen: S.screen };
  S = initState(); Object.assign(S, keep);
  renderPbar(); render();
  toast('Đã reset dữ liệu demo.', 'ok');
}
window.Proto = { S: () => S, setScreen, openDrawer, ApplyCtl };
renderPbar();
render();

</script>
</body>
</html>
